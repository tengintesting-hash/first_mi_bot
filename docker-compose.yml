services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped

  bot:
    build: ./bot
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
